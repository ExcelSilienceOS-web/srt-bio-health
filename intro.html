<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EXCELSILIENCE HUMAN OS — Calibração de Bordo (Introdução)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0b1329; color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; padding: 16px;
        }
        .container {
            width: 100%; max-width: 440px; background: #1e293b;
            border-radius: 20px; padding: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 1px solid #334155;
        }
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { font-size: 20px; font-weight: 900; color: #38bdf8; letter-spacing: 1px; }
        .header p { font-size: 12px; color: #94a3b8; margin-top: 4px; }
        .card {
            background: #0f172a; border: 1px solid #334155; border-radius: 12px;
            padding: 16px; margin-bottom: 16px; text-align: center;
        }
        .phrase-box {
            background: rgba(56, 189, 248, 0.1); border: 1px solid #0284c7;
            border-radius: 8px; padding: 14px; font-weight: 700; color: #fbbf24;
            font-size: 14px; margin: 12px 0; line-height: 1.4;
        }
        .btn {
            width: 100%; padding: 14px; border: none; border-radius: 8px;
            font-size: 14px; font-weight: 800; cursor: pointer;
            background: #0284c7; color: #fff; transition: 0.2s;
        }
        .btn:disabled { background: #334155; color: #64748b; cursor: not-allowed; }
        .status-box {
            padding: 12px; border-radius: 8px; font-size: 12px; font-weight: 700;
            text-align: center; margin-top: 12px; display: none;
        }
        .status-green { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid #10b981; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>EXCELSILIENCE HUMAN OS</h1>
            <p>INTRODUÇÃO :: CALIBRAÇÃO DA LINHA DE BASE VOCAL</p>
        </div>

        <div class="card">
            <p style="font-size: 13px; color: #cbd5e1;">Para inicializar o seu Exocórtex™, precisamos calibrar a sua frequência vocal em repouso (Zero Pergunta Escrita).</p>
            <div class="phrase-box">
                "Pronto para operar hoje com foco, energia e soberania."
            </div>
            <button id="btnStart" class="btn" onclick="iniciarCalibracao()">🎙️ Permitir Microfone & Gravar (5s)</button>
            <div id="statusResult" class="status-box"></div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://uywfcrhryrzmhrukxgaf.supabase.co/rest/v1/srt_checkins';
        const SUPABASE_KEY = 'sb_publishable_o9kI6CRx6XzKNABTVef4Bw_dgaSyl3b';

        // Recupera ou cria ID do leitor
        let readerId = localStorage.getItem('excs_reader_id');
        if (!readerId) {
            readerId = 'LEITOR-' + Math.random().toString(36).substr(2, 8).toUpperCase();
            localStorage.setItem('excs_reader_id', readerId);
        }

        let mediaStream, audioCtx, analyser, microphone, dataArray;
        let audioSamples = [];

        async function iniciarCalibracao() {
            const btn = document.getElementById('btnStart');
            btn.innerText = '🔴 Calibrando Frequência Basal (5s)...';
            btn.disabled = true;

            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 256;
                microphone = audioCtx.createMediaStreamSource(mediaStream);
                microphone.connect(analyser);
                dataArray = new Uint8Array(analyser.frequencyBinCount);

                const interval = setInterval(() => {
                    analyser.getByteFrequencyData(dataArray);
                    let sum = dataArray.reduce((a, b) => a + b, 0);
                    audioSamples.push(sum / dataArray.length);
                }, 100);

                setTimeout(() => {
                    clearInterval(interval);
                    if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
                    finalizarLinhaDeBase();
                }, 5000);

            } catch (err) {
                alert('Acesso ao microfone necessário para a calibração biométrica.');
                btn.innerText = '🔄 Tentar Novamente';
                btn.disabled = false;
            }
        }

        async function finalizarLinhaDeBase() {
            let sum = audioSamples.reduce((a, b) => a + b, 0);
            let mean = sum / (audioSamples.length || 1);
            let variance = audioSamples.reduce((a, b) => a + Math.pow(b - mean, 2), 0) / (audioSamples.length || 1);
            let vsiBase = (1.0 + (Math.sqrt(variance) / (mean + 1)) * 4).toFixed(2);

            // Salva a linha de base localmente e envia ao Supabase
            localStorage.setItem('excs_vsi_base', vsiBase);

            const payload = {
                timestamp: new Date().toLocaleTimeString('pt-BR'),
                company: 'Livro ExcelSilience',
                name: readerId,
                sector: 'Introdução - Linha de Base',
                reaction_ms: 0,
                status: 'GREEN',
                vsi_status: `VSI_BASE_${vsiBase}`
            };

            await fetch(SUPABASE_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` },
                body: JSON.stringify(payload)
            });

            const statusBox = document.getElementById('statusResult');
            statusBox.className = 'status-box status-green';
            statusBox.style.display = 'block';
            statusBox.innerHTML = `✅ <b>Linha de Base Gravada!</b><br>ID do Exocórtex: <code>${readerId}</code><br>VSI Basal: <b>${vsiBase}</b><br><br><a href="c0.html" style="color:#38bdf8; font-weight:800; text-decoration:none;">Avançar para o Capítulo 0 ➔</a>`;
        }
    </script>
</body>
</html>
