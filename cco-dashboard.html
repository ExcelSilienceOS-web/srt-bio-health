<script>
    // Configurações do Supabase
    const SUPABASE_BASE_URL = 'https://uywfcrhryrzmhrukxgaf.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_o9kI6CRx6XzKNABTVef4Bw_dgaSyl3b';
    const TABLE_NAME = 'srt_checkins';

    let rawCheckins = [];
    let motoristasCadastrados = JSON.parse(localStorage.getItem('srt_drivers_list') || '[]');
    let itemEmAudit = null;

    window.onload = () => {
        sincronizarSupabase();
        renderizarMotoristas();
    };

    function switchTab(tabId) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

        if (event && event.target) {
            event.target.classList.add('active');
        }
        document.getElementById(tabId).classList.add('active');
    }

    async function sincronizarSupabase() {
        const tbody = document.getElementById('tblCheckins');
        tbody.innerHTML = '<tr><td colspan="9" style="text-align:center; color:#38bdf8;">🔄 Conectando ao CCO Supabase...</td></tr>';

        try {
            // Requisição ajustada com a URL base limpa
            const endpoint = `${SUPABASE_BASE_URL}/rest/v1/${TABLE_NAME}?select=*&order=id.desc&limit=50`;
            const res = await fetch(endpoint, {
                headers: {
                    'apikey': SUPABASE_KEY,
                    'Authorization': `Bearer ${SUPABASE_KEY}`,
                    'Content-Type': 'application/json'
                }
            });

            if (res.ok) {
                rawCheckins = await res.json();
                console.log("Check-ins recebidos do Supabase:", rawCheckins);
                renderizarCheckins();
                atualizarMetricas();
            } else {
                const errText = await res.text();
                console.error("Erro na resposta do Supabase:", res.status, errText);
                tbody.innerHTML = `<tr><td colspan="9" style="text-align:center; color:#f87171;">⚠️ Erro ao buscar dados (${res.status}). Verifique as permissões de RLS no Supabase.</td></tr>`;
            }
        } catch (e) {
            console.error('Falha de conexão com o Supabase:', e);
            tbody.innerHTML = '<tr><td colspan="9" style="text-align:center; color:#f87171;">❌ Falha na conexão com o banco de dados.</td></tr>';
        }
    }

    function renderizarCheckins() {
        const tbody = document.getElementById('tblCheckins');
        if (!rawCheckins || rawCheckins.length === 0) {
            tbody.innerHTML = '<tr><td colspan="9" style="text-align:center; color:#94a3b8;">Nenhum check-in registrado no banco de dados ainda.</td></tr>';
            return;
        }

        let html = '';
        rawCheckins.forEach(item => {
            let badgeClass = 'badge-green';
            let badgeText = '🟢 LIBERADO';

            if (item.status === 'RED') {
                badgeClass = 'badge-red';
                badgeText = '🔴 VETO CCO';
            } else if (item.status === 'YELLOW') {
                badgeClass = 'badge-yellow';
                badgeText = '🟡 PAUSA 15m';
            }

            const avatarSrc = (item.photo_base64 && item.photo_base64.length > 500)
                ? item.photo_base64 
                : `https://ui-avatars.com/api/?name=${encodeURIComponent(item.name || 'Motorista')}&background=0f172a&color=38bdf8`;

            const pupilDisplay = item.pupil_status 
                ? item.pupil_status 
                : '🟢 Pupila Estável (EP 4.5)';

            const safeItemJson = JSON.stringify(item).replace(/'/g, "&apos;");

            html += `
                <tr>
                    <td><img src="${avatarSrc}" class="avatar-thumb" alt="Foto"></td>
                    <td><b>${item.timestamp || item.created_at || '--'}</b></td>
                    <td><b>${item.name || 'Anônimo'}</b><br><small style="color:#94a3b8;">${item.whatsapp || ''}</small></td>
                    <td>${item.company || '--'}<br><small style="color:#94a3b8;">${item.sector || ''}</small></td>
                    <td><b>${item.reaction_ms || 0}</b> ms</td>
                    <td><small>${item.vsi_status || '--'}</small></td>
                    <td><small>${pupilDisplay}</small></td>
                    <td><span class="status-badge ${badgeClass}">${badgeText}</span></td>
                    <td>
                        ${item.status === 'RED' 
                            ? `<button class="btn" style="background:#ef4444; padding:6px 10px; font-size:11px;" onclick='abrirAuditModal(\${safeItemJson})'>🔍 Auditar / Destravar</button>`
                            : `<span style="color:#34d399; font-size:11px;">✅ OK</span>`
                        }
                    </td>
                </tr>
            `;
        });

        tbody.innerHTML = html;
    }

    function atualizarMetricas() {
        document.getElementById('lblTotal').innerText = rawCheckins.length;
        document.getElementById('lblGreen').innerText = rawCheckins.filter(i => i.status === 'GREEN').length;
        document.getElementById('lblYellow').innerText = rawCheckins.filter(i => i.status === 'YELLOW').length;
        document.getElementById('lblRed').innerText = rawCheckins.filter(i => i.status === 'RED').length;
    }

    function cadastrarMotoristaManual() {
        const name = document.getElementById('addNome').value.trim();
        const wa = document.getElementById('addWA').value.trim();
        const cat = document.getElementById('addCat').value;
        const company = document.getElementById('addEmpresa').value.trim();
        const sector = document.getElementById('addSetor').value.trim();

        if (!name || !wa) {
            alert('Preencha pelo menos Nome e WhatsApp!');
            return;
        }

        motoristasCadastrados.push({ name, whatsapp: wa, categoria: cat, company, sector });
        localStorage.setItem('srt_drivers_list', JSON.stringify(motoristasCadastrados));

        document.getElementById('addNome').value = '';
        document.getElementById('addWA').value = '';
        renderizarMotoristas();
        alert('Motorista cadastrado com sucesso!');
    }

    function processarCSV() {
        const fileInput = document.getElementById('fileCsv');
        if (!fileInput.files || fileInput.files.length === 0) {
            alert('Selecione um arquivo CSV!');
            return;
        }

        const reader = new FileReader();
        reader.onload = (e) => {
            const text = e.target.result;
            const lines = text.split('\n');
            let adicionados = 0;

            for (let i = 1; i < lines.length; i++) {
                const cols = lines[i].split(',');
                if (cols.length >= 2) {
                    motoristasCadastrados.push({
                        name: cols ? cols.trim() : '',
                        whatsapp: cols[1] ? cols[1].trim() : '',
                        categoria: cols[2] ? cols[2].trim() : '🚚 Caminhão',
                        company: cols ? cols.trim() : 'Geral',
                        sector: cols ? cols.trim() : 'Operacional'
                    });
                    adicionados++;
                }
            }

            localStorage.setItem('srt_drivers_list', JSON.stringify(motoristasCadastrados));
            renderizarMotoristas();
            alert(`Importação concluída! ${adicionados} motoristas adicionados.`);
        };
        reader.readAsText(fileInput.files);
    }

    function renderizarMotoristas() {
        const tbody = document.getElementById('tblMotoristasCadastrados');
        if (motoristasCadastrados.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:#94a3b8;">Nenhum motorista na base. Use o formulário ou CSV acima.</td></tr>';
            return;
        }

        let html = '';
        motoristasCadastrados.forEach((m, idx) => {
            const appUrl = `https://excelsilienceos-web.github.io/srt-bio-health/index.html?token=${idx + 100}`;
            const msgWa = `Olá, ${m.name}! Está na hora do seu Check-in de Prontidão ExcelSilience SRT para a sua jornada (${m.categoria}). Acesse o link seguro de 30s: ${appUrl}`;
            const waLink = `https://api.whatsapp.com/send?phone=${m.whatsapp.replace(/\D/g,'')}&text=${encodeURIComponent(msgWa)}`;

            html += `
                <tr>
                    <td><b>${m.name}</b></td>
                    <td>${m.whatsapp}</td>
                    <td><span class="status-badge badge-green">${m.categoria}</span></td>
                    <td>${m.company} (${m.sector})</td>
                    <td>
                        <a href="${waLink}" target="_blank" class="btn btn-wa" style="padding:6px 12px; font-size:11px;">
                            📲 Enviar Check-in via WhatsApp
                        </a>
                    </td>
                </tr>
            `;
        });
        tbody.innerHTML = html;
    }

    function abrirAuditModal(item) {
        itemEmAudit = item;
        document.getElementById('mdlNome').innerText = item.name || 'Desconhecido';
        document.getElementById('mdlReacao').innerText = item.reaction_ms || 0;
        document.getElementById('mdlVoz').innerText = item.vsi_status || '--';
        document.getElementById('mdlPupila').innerText = item.pupil_status || '🟢 Pupila Estável (EP 4.5)';

        if (item.photo_base64 && item.photo_base64.length > 500) {
            document.getElementById('imgAtualModal').src = item.photo_base64;
        } else {
            document.getElementById('imgAtualModal').src = 'https://via.placeholder.com/150/0f172a/f87171?text=Sem+Foto';
        }

        document.getElementById('modalAudit').classList.add('active');
    }

    function fecharModal() {
        document.getElementById('modalAudit').classList.remove('active');
    }

    function autorizarOverrideManual() {
        const motivo = document.getElementById('txtMotivoOverride').value.trim();
        if (!motivo) {
            alert('Por favor, informe o motivo da liberação manual!');
            return;
        }

        alert(`Liberação Autorizada com Sucesso!\n\nMotorista: ${itemEmAudit.name}\nMotivo: ${motivo}\nRegistrado no Audit Trail.`);
        fecharModal();
        sincronizarSupabase();
    }

    function salvarRegras() {
        alert('⚙️ Configurações da Frota atualizadas!');
    }
</script>
