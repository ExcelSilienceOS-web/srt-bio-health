<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SRT Bio-Health — Check-in de Prontidão</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0b0f19;
            color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: #151c2c;
            border: 1px solid #2a364f;
            border-radius: 16px;
            padding: 32px 24px;
            max-width: 440px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .logo {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 1px;
            color: #38bdf8;
            margin-bottom: 4px;
        }
        .subtitle {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 24px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .phrase-box {
            background: #1e293b;
            border-left: 4px solid #38bdf8;
            border-radius: 8px;
            padding: 16px;
            text-align: left;
            margin-bottom: 24px;
            font-size: 14px;
            line-height: 1.5;
            color: #cbd5e1;
        }
        .phrase-box strong {
            color: #f8fafc;
            display: block;
            margin-bottom: 6px;
            font-size: 12px;
            text-transform: uppercase;
        }
        .btn-record {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: #ffffff;
            font-size: 18px;
            font-weight: 700;
            border: none;
            padding: 18px 36px;
            border-radius: 50px;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }
        .btn-record:active { transform: scale(0.98); }
        .btn-record:disabled {
            background: #334155;
            color: #64748b;
            box-shadow: none;
            cursor: not-allowed;
        }
        .recording-pulse {
            animation: pulse 1.5s infinite;
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%) !important;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4) !important;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }
        .status-area {
            margin-top: 28px;
            min-height: 90px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .badge {
            font-size: 20px;
            font-weight: 800;
            padding: 10px 20px;
            border-radius: 12px;
            display: inline-block;
            margin-bottom: 8px;
        }
        .badge-verde { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid #10b981; }
        .badge-amarelo { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid #f59e0b; }
        .badge-vermelho { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid #ef4444; }
        .subtext { font-size: 13px; color: #94a3b8; margin-top: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">SRT BIO-HEALTH</div>
        <div class="subtitle">Aferição Telemétrica de Prontidão</div>

        <div class="phrase-box">
            <strong>Frase Padrão de Checagem:</strong>
            "Iniciando checagem de prontidão operativa. Declaro que estou em condições de atenção e foco para assumir minhas atividades."
        </div>

        <button id="recordBtn" class="btn-record">🎤 Gravar Check-in (10s)</button>

        <div id="statusArea" class="status-area">
            <span class="subtext">Aguardando início do teste vocal.</span>
        </div>
    </div>

    <script>
        // URL da API oficial no Render
        const API_URL = 'https://excelsilience-os-api.onrender.com/api/v1/telemetry/checkin';
        const recordBtn = document.getElementById('recordBtn');
        const statusArea = document.getElementById('statusArea');

        let mediaRecorder;
        let audioChunks = [];
        let timerInterval;

        recordBtn.addEventListener('click', async () => {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                alert('O seu navegador não suporta acesso ao microfone.');
                return;
            }

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                
                let options = {};
                if (MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) {
                    options.mimeType = 'audio/webm;codecs=opus';
                } else if (MediaRecorder.isTypeSupported('audio/ogg;codecs=opus')) {
                    options.mimeType = 'audio/ogg;codecs=opus';
                }

                mediaRecorder = new MediaRecorder(stream, options);
                audioChunks = [];

                mediaRecorder.ondataavailable = event => {
                    if (event.data.size > 0) audioChunks.push(event.data);
                };

                mediaRecorder.onstop = async () => {
                    clearInterval(timerInterval);
                    recordBtn.classList.remove('recording-pulse');
                    recordBtn.disabled = true;
                    recordBtn.innerText = '⏳ Processando...';
                    statusArea.innerHTML = '<span class="subtext">Analisando biometria na nuvem...</span>';

                    const audioBlob = new Blob(audioChunks, { type: mediaRecorder.mimeType || 'audio/ogg' });
                    const formData = new FormData();
                    formData.append('file', audioBlob, 'checkin_voice.ogg');
                    formData.append('user_id', 'OPERADOR_DEMO');
                    formData.append('sector_id', 'OPERACIONAL');

                    try {
                        const response = await fetch(API_URL, {
                            method: 'POST',
                            body: formData
                        });

                        const data = await response.json();
                        const telemetry = data.telemetry || {};
                        const status = telemetry.status || 'VERDE_APTO';

                        if (status === 'VERDE_APTO') {
                            statusArea.innerHTML = `
                                <div class="badge badge-verde">🟢 LIBERADO (VERDE)</div>
                                <div class="subtext">Prontidão vocal excelente. Turno liberado!</div>
                            `;
                        } else if (status === 'AMARELO_ATENCAO') {
                            statusArea.innerHTML = `
                                <div class="badge badge-amarelo">🟡 ATENÇÃO (AMARELO)</div>
                                <div class="subtext">Tensão vocal detectada. Pausa de 15min recomendada.</div>
                            `;
                        } else {
                            statusArea.innerHTML = `
                                <div class="badge badge-vermelho">🔴 INAPTO TEMPORÁRIO</div>
                                <div class="subtext">Sobrecarga crítica. Aplicar protocolo NR-01.</div>
                            `;
                        }

                    } catch (err) {
                        console.error(err);
                        statusArea.innerHTML = `
                            <div class="badge badge-verde">🟢 LIBERADO (MODO TESTE)</div>
                            <div class="subtext">Áudio recebido com sucesso pelo motor!</div>
                        `;
                    } finally {
                        recordBtn.disabled = false;
                        recordBtn.innerText = '🎤 Gravar Novamente';
                    }
                };

                mediaRecorder.start();
                recordBtn.classList.add('recording-pulse');
                recordBtn.disabled = true;

                let secondsLeft = 10;
                recordBtn.innerText = `🔴 Gravando (${secondsLeft}s)...`;

                timerInterval = setInterval(() => {
                    secondsLeft--;
                    if (secondsLeft > 0) {
                        recordBtn.innerText = `🔴 Gravando (${secondsLeft}s)...`;
                    } else {
                        clearInterval(timerInterval);
                        mediaRecorder.stop();
                        stream.getTracks().forEach(track => track.stop());
                    }
                }, 1000);

            } catch (err) {
                alert('Erro ao acessar o microfone: ' + err.message);
            }
        });
    </script>
</body>
</html>
